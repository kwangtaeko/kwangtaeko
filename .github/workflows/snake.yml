name: Generate Snake

# 잔디를 먹는 뱀 SVG 를 하루 한 번 output 브랜치에 굽는다.
# 색은 README 의 TGX 팔레트 — 다크는 웜 차콜 위 주황, 라이트는 크림 위 주황.
# 비공개 저장소 커밋까지 잔디에 찍히려면 프로필 설정의
# "Include private contributions on my profile" 이 켜져 있어야 한다.
on:
  schedule:
    - cron: "41 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kwangtaeko
          outputs: |
            dist/snake-dark.svg?color_snake=#fb923c&color_dots=#1a1715,#3b2416,#6b3413,#bf4008,#fb923c&color_dot_border=#100e0d
            dist/snake-light.svg?color_snake=#7c4dd6&color_dots=#f3ece6,#f7c9a2,#f59e5c,#d9631c,#bf4008&color_dot_border=#ffffff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
