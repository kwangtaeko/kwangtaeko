<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 830 460" width="830" height="460" role="img" aria-label="built in private — TG Platform, TGX Agent Chatbot, TG-Nova, 시장장터, 네오뮤직, TG Launcher"><title>built in private — TG Platform, TGX Agent Chatbot, TG-Nova, 시장장터, 네오뮤직, TG Launcher</title><g transform="translate(0.0 0.0)"><rect width="408.0" height="150" rx="10" fill="#1a1715" stroke="#332b26"/><rect x="319.8" y="18" width="70.2" height="20" rx="10" fill="#332b26"/><text x="354.9" y="31.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#a99a90">● private</text><text x="18" y="34" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#f2e9e3">TG Platform</text><text x="18" y="60" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#a99a90">저장소 간 개발 표준의 정본. RFC 9457 오류 계약을 패키지로</text><text x="18" y="79" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#a99a90">배포하고, requestId · traceId · 구조화 로그를 기본으로 주는</text><text x="18" y="98" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#a99a90">Spring Boot Starter까지.</text><rect x="18.0" y="112" width="79.6" height="20" rx="4" fill="#100e0d" stroke="#332b26"/><text x="57.8" y="125.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#f2e9e3">Spring Boot</text><rect x="103.6" y="112" width="66.2" height="20" rx="4" fill="#100e0d" stroke="#332b26"/><text x="136.7" y="125.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#f2e9e3">RFC 9457</text><rect x="175.8" y="112" width="50.0" height="20" rx="4" fill="#100e0d" stroke="#332b26"/><text x="200.8" y="125.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#f2e9e3">ADR ×5</text></g><g transform="translate(422.0 0.0)"><rect width="408.0" height="150" rx="10" fill="#1a1715" stroke="#332b26"/><rect x="319.8" y="18" width="70.2" height="20" rx="10" fill="#332b26"/><text x="354.9" y="31.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#a99a90">● private</text><text x="18" y="34" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#f2e9e3">TGX Agent Chatbot</text><text x="18" y="60" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#a99a90">로컬 Ollama 위의 에이전트형 RAG 를 어느 사이트에나 위젯으로</text><text x="18" y="79" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#a99a90">붙이는 범용 챗봇으로 키웠다. 멀티 테넌트 · 가드레일 · BM25 +</text><text x="18" y="98" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#a99a90">벡터 하이브리드 · 런북 9종.</text><rect x="18.0" y="112" width="60.5" height="20" rx="4" fill="#100e0d" stroke="#332b26"/><text x="48.3" y="125.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#f2e9e3">FastAPI</text><rect x="84.5" y="112" width="70.6" height="20" rx="4" fill="#100e0d" stroke="#332b26"/><text x="119.8" y="125.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#f2e9e3">LangGraph</text><rect x="161.1" y="112" width="94.1" height="20" rx="4" fill="#100e0d" stroke="#332b26"/><text x="208.2" y="125.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#f2e9e3">OpenTelemetry</text></g><g transform="translate(0.0 164.0)"><rect width="408.0" height="131" rx="10" fill="#1a1715" stroke="#332b26"/><rect x="319.8" y="18" width="70.2" height="20" rx="10" fill="#332b26"/><text x="354.9" y="31.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#a99a90">● private</text><text x="18" y="34" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#f2e9e3">TG-Nova</text><text x="18" y="60" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#a99a90">송금 · 페이 · 투자가 한 원장을 공유하는 핀테크 백엔드. 잔액은</text><text x="18" y="79" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#a99a90">저장하지 않고 원장에서 도출한다.</text><rect x="18.0" y="93" width="52.1" height="20" rx="4" fill="#100e0d" stroke="#332b26"/><text x="44.1" y="106.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#f2e9e3">Kotlin</text><rect x="76.1" y="93" width="79.6" height="20" rx="4" fill="#100e0d" stroke="#332b26"/><text x="115.9" y="106.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#f2e9e3">Spring Boot</text><rect x="161.8" y="93" width="42.0" height="20" rx="4" fill="#100e0d" stroke="#332b26"/><text x="182.8" y="106.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#f2e9e3">jOOQ</text></g><g transform="translate(422.0 164.0)"><rect width="408.0" height="131" rx="10" fill="#1a1715" stroke="#332b26"/><rect x="319.8" y="18" width="70.2" height="20" rx="10" fill="#332b26"/><text x="354.9" y="31.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#a99a90">● private</text><text x="18" y="34" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#f2e9e3">시장장터</text><text x="18" y="60" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#a99a90">도매와 구매업주를 잇는 B2B 마켓. 브랜드 · 본사 · 매장 3층</text><text x="18" y="79" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#a99a90">멀티테넌시와 Outbox 비동기. 친구들과 함께, PM 은 내가.</text><rect x="18.0" y="93" width="79.6" height="20" rx="4" fill="#100e0d" stroke="#332b26"/><text x="57.8" y="106.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#f2e9e3">Spring Boot</text><rect x="103.6" y="93" width="56.1" height="20" rx="4" fill="#100e0d" stroke="#332b26"/><text x="131.7" y="106.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#f2e9e3">Next.js</text><rect x="165.7" y="93" width="40.4" height="20" rx="4" fill="#100e0d" stroke="#332b26"/><text x="185.9" y="106.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#f2e9e3">Expo</text></g><g transform="translate(0.0 309.0)"><rect width="408.0" height="150" rx="10" fill="#1a1715" stroke="#332b26"/><rect x="319.8" y="18" width="70.2" height="20" rx="10" fill="#332b26"/><text x="354.9" y="31.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#a99a90">● private</text><text x="18" y="34" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#f2e9e3">네오뮤직</text><text x="18" y="60" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#a99a90">실용음악 학원 예약 앱. 연습실 예약과 레슨 일정을 한곳에서</text><text x="18" y="79" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#a99a90">잡는다. 설치 없는 PWA 로, 엣지에서 돈다.</text><rect x="18.0" y="93" width="56.1" height="20" rx="4" fill="#100e0d" stroke="#332b26"/><text x="46.1" y="106.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#f2e9e3">Next.js</text><rect x="80.1" y="93" width="120.8" height="20" rx="4" fill="#100e0d" stroke="#332b26"/><text x="140.5" y="106.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#f2e9e3">Cloudflare Workers</text><rect x="206.9" y="93" width="40.4" height="20" rx="4" fill="#100e0d" stroke="#332b26"/><text x="227.1" y="106.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#f2e9e3">Neon</text></g><g transform="translate(422.0 309.0)"><rect width="408.0" height="150" rx="10" fill="#1a1715" stroke="#332b26"/><rect x="319.8" y="18" width="70.2" height="20" rx="10" fill="#332b26"/><text x="354.9" y="31.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#a99a90">● private</text><text x="18" y="34" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#f2e9e3">TG Launcher</text><text x="18" y="60" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#a99a90">배포한 TG 사이트들로 들어가는 단 하나의 문. 허용된 구글 계정 +</text><text x="18" y="79" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#a99a90">TOTP 2단계 인증을 통과해야 열리고, 보호 사이트에는 서명</text><text x="18" y="98" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#a99a90">토큰으로 SSO. 누가 들어오면 폰으로 웹푸시.</text><rect x="18.0" y="112" width="72.7" height="20" rx="4" fill="#100e0d" stroke="#332b26"/><text x="54.4" y="125.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#f2e9e3">Next.js 16</text><rect x="96.7" y="112" width="56.1" height="20" rx="4" fill="#100e0d" stroke="#332b26"/><text x="124.8" y="125.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#f2e9e3">Auth.js</text><rect x="158.8" y="112" width="42.9" height="20" rx="4" fill="#100e0d" stroke="#332b26"/><text x="180.2" y="125.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#f2e9e3">TOTP</text></g></svg>
